name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '26.3.1'
  NPM_VERSION: '11.21.3'

jobs:
  build:
    name: Build and test release packages
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: arm64
          package-manager-cache: false
      - name: Check release version
        id: version
        run: |
          version=$(node scripts/check-release-version.ts)
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$GITHUB_REF" != "refs/tags/v$version" ]]; then
              echo "The release tag must be v$version." >&2
              exit 1
            fi
            git merge-base --is-ancestor HEAD origin/main
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install locked dependencies
        run: |
          npm install --global --ignore-scripts "npm@$NPM_VERSION"
          pnpm install --frozen-lockfile
      - name: Verify source
        run: pnpm verify
      - name: Pack and test both archives
        run: |
          pnpm pack:cli
          pnpm pack:paseo
          pnpm test:cli-package
          pnpm test:paseo-package
      - name: Gather release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cli="kelvicthrust-agent-productivity-hq-$VERSION.tgz"
          paseo="kelvicthrust-paseo-agent-productivity-hq-$VERSION.tgz"
          mkdir dist/release
          cp "dist/cli/$cli" "dist/paseo/$paseo" dist/release/
          cd dist/release
          shasum -a 256 "$cli" "$paseo" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - name: Upload verified release assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-productivity-hq-${{ steps.version.outputs.version }}-${{ github.run_attempt }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  npm:
    name: Publish and verify npm packages
    if: github.event_name == 'push' && github.repository == 'kelvicthrust/agent-productivity-hq'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install --global --ignore-scripts "npm@$NPM_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/release
      - name: Verify checksums and publish to npm
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          (cd dist/release && shasum -a 256 -c SHA256SUMS)
          node scripts/publish-release-npm.ts "$VERSION" dist/release

  github:
    name: Publish GitHub release
    needs: [build, npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
        working-directory: release
        run: |
          shasum -a 256 -c SHA256SUMS
          tag="refs/tags/v$VERSION"
          tag_commit=$(git ls-remote "$GITHUB_SERVER_URL/$GH_REPO.git" "$tag" "$tag^{}" | \
            awk -v tag="$tag" '$2 == tag { tip=$1 } $2 == tag "^{}" { peeled=$1 } END { print (peeled == "" ? tip : peeled) }')
          if [[ "$tag_commit" != "$BUILT_COMMIT" ]]; then
            echo "The remote tag v$VERSION no longer points to the built commit." >&2
            exit 1
          fi
          gh release create "v$VERSION" --verify-tag --generate-notes \
            --title "Agent Productivity HQ v$VERSION" \
            "kelvicthrust-agent-productivity-hq-$VERSION.tgz" \
            "kelvicthrust-paseo-agent-productivity-hq-$VERSION.tgz" SHA256SUMS
