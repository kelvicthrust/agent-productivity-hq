name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - packages/cli/package.json
      - plugins/paseo-agent-productivity/package.json
  pull_request:
    branches: [main]
    paths:
      - package.json
      - packages/cli/package.json
      - plugins/paseo-agent-productivity/package.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'push' && 'main' || github.run_id }}
  queue: max

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '26.3.1'
  NPM_VERSION: '11.21.3'

jobs:
  version:
    name: Check release version
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.repository == 'kelvicthrust/agent-productivity-hq' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Check release version
        id: version
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version=$(node scripts/check-release-version.ts)
          else
            previous=$(git show "$BEFORE:package.json" | jq -er '.version')
            version=$(node scripts/check-release-version.ts "$previous")
            if [[ -z "$version" ]]; then
              echo "Package version did not change."
              exit 0
            fi
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag="refs/tags/v$version"
            if git show-ref --verify --quiet "$tag" &&
              [[ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "Tag v$version already points to another commit." >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check queued release labels
        if: github.event_name == 'push' && steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/prepare-label-release.ts "$GITHUB_REPOSITORY" --check "$GITHUB_SHA" "$VERSION"

  build:
    name: Build and test release packages
    needs: version
    if: github.event_name != 'pull_request' && needs.version.outputs.version != ''
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: arm64
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install locked dependencies
        run: |
          npm install --global --ignore-scripts "npm@$NPM_VERSION"
          pnpm install --frozen-lockfile
      - name: Verify source
        run: pnpm verify
      - name: Pack and test both archives
        run: |
          pnpm pack:cli
          pnpm pack:paseo
          pnpm test:cli-package
          pnpm test:paseo-package
      - name: Gather release assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cli="kelvicthrust-agent-productivity-hq-$VERSION.tgz"
          paseo="kelvicthrust-paseo-agent-productivity-hq-$VERSION.tgz"
          mkdir dist/release
          cp "dist/cli/$cli" "dist/paseo/$paseo" dist/release/
          assets=("$cli" "$paseo")
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            notes="v$VERSION.md"
            cp "docs/releases/$notes" dist/release/
            assets+=("$notes")
          fi
          cd dist/release
          shasum -a 256 "${assets[@]}" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - name: Upload verified release assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-productivity-hq-${{ needs.version.outputs.version }}-${{ github.run_attempt }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  npm:
    name: Publish and verify npm packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'kelvicthrust/agent-productivity-hq'
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install --global --ignore-scripts "npm@$NPM_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/release
      - name: Verify checksums and publish to npm
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd dist/release && shasum -a 256 -c SHA256SUMS)
          node scripts/publish-release-npm.ts "$VERSION" dist/release

  github:
    name: Publish GitHub release
    needs: [version, build, npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILT_COMMIT: ${{ github.sha }}
        working-directory: release
        run: |
          shasum -a 256 -c SHA256SUMS
          tag="refs/tags/v$VERSION"
          tag_commit=$(git ls-remote "$GITHUB_SERVER_URL/$GH_REPO.git" "$tag" "$tag^{}" | \
            awk -v tag="$tag" '$2 == tag { tip=$1 } $2 == tag "^{}" { peeled=$1 } END { print (peeled == "" ? tip : peeled) }')
          if [[ -z "$tag_commit" ]]; then
            tag_commit=$(gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="$tag" -f sha="$BUILT_COMMIT" --jq '.object.sha')
          fi
          if [[ "$tag_commit" != "$BUILT_COMMIT" ]]; then
            echo "Tag v$VERSION does not point to the built commit." >&2
            exit 1
          fi
          gh release create "v$VERSION" --verify-tag --notes-file "v$VERSION.md" \
            --title "Agent Productivity HQ v$VERSION" \
            "kelvicthrust-agent-productivity-hq-$VERSION.tgz" \
            "kelvicthrust-paseo-agent-productivity-hq-$VERSION.tgz" "v$VERSION.md" SHA256SUMS
